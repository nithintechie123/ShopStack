server.port=${PORT:8081}
spring.profiles.active=dev
spring.main.allow-bean-definition-overriding=true

spring.datasource.url=jdbc:mysql://localhost:3306/shopstack?createDatabaseIfNotExist=true
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

# Uses server.port dynamically (defaults to 8081 if not set)
app.base-url=http://localhost:${server.port:8081}


# Razorpay Credentials loaded from .env
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# Cloudinary Configuration
cloudinary.url=${CLOUDINARY_URL:}

